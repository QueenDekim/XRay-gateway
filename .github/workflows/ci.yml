name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: python scripts/check_version.py
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py --tag "$RELEASE_TAG"
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: node --check gateway/web/app.js
      - run: node --check gateway/web/theme.js
      - run: node --check gateway/web/i18n.js
      - run: node --check gateway/web/management.js
      - run: node --check gateway/web/terminal-stream.js
      - run: node --check gateway/web/login.js
      - run: node --check gateway/web/updates.js
      - run: node scripts/check_page_runtime.mjs
      - run: node scripts/check_login_frontend.mjs
      - run: node scripts/check_panel_frontend.mjs
      - run: node scripts/check_terminal_emulator.mjs
      - run: python scripts/check_docs.py
      - run: python scripts/configure.py --env-file .env.example --check
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.proxy.yaml config --quiet
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} -f gateway/Dockerfile -t xray-gateway:test .
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} -f updater/Dockerfile -t xray-gateway-updater:test .
      - run: python3 scripts/check_updater_integration.py --gateway-image xray-gateway:test --updater-image xray-gateway-updater:test
      - run: python3 scripts/check_vless_transports.py --image xray-gateway:test
      - run: python3 scripts/smoke_container.py --image xray-gateway:test

  publish:
    name: Publish GHCR images
    needs: [test, image]
    if: github.ref_type == 'tag' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_version.py --tag "$RELEASE_TAG"
      - name: Prepare image tags
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          updater="$image-updater"
          version=$(cat VERSION)
          minor="${version%.*}"
          major="${version%%.*}"
          {
            echo "image=$image"
            echo "version=$version"
            echo "updater=$updater"
            echo 'tags<<IMAGE_TAGS'
            printf '%s\n' "$image:$RELEASE_TAG" "$image:$version" "$image:$minor" "$image:$major" "$image:latest"
            echo 'IMAGE_TAGS'
            echo 'updater_tags<<UPDATER_TAGS'
            printf '%s\n' "$updater:$RELEASE_TAG" "$updater:$version" "$updater:$minor" "$updater:$major" "$updater:latest"
            echo 'UPDATER_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish updater
        id: push_updater
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.updater_tags }}
          labels: |
            org.opencontainers.image.title=Xray Gateway Updater
            org.opencontainers.image.description=Compose update worker for Xray Gateway
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
          provenance: mode=min
      - name: Build and publish
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Xray Gateway
            org.opencontainers.image.description=Transparent Xray gateway and web management panel
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          provenance: mode=min
      - name: Verify published image
        env:
          UPDATER: ${{ steps.meta.outputs.updater }}
          UPDATER_DIGEST: ${{ steps.push_updater.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          docker pull "$UPDATER@$UPDATER_DIGEST"
          docker run --rm --network none --entrypoint python3 \
            -e EXPECTED_REVISION -e EXPECTED_TAG "$UPDATER@$UPDATER_DIGEST" \
            -c 'import os; from version import build_info; info=build_info(); assert info["revision"]==os.environ["EXPECTED_REVISION"]; assert info["tag"]==os.environ["EXPECTED_TAG"]; print(info["version"])'
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --network none --entrypoint python3 \
            -e EXPECTED_REVISION -e EXPECTED_TAG "$IMAGE@$DIGEST" \
            -c 'import os; from version import build_info; info=build_info(); assert info["revision"]==os.environ["EXPECTED_REVISION"]; assert info["tag"]==os.environ["EXPECTED_TAG"]; print(info["version"])'
          {
            echo '### Published container'
            echo "- Image: \`$IMAGE:$EXPECTED_TAG\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Updater: \`$UPDATER:$EXPECTED_TAG\` (\`$UPDATER_DIGEST\`)"
            echo '- Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
