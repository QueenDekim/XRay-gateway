name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: python scripts/check_version.py
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_version.py --tag "$RELEASE_TAG"
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: node --check gateway/web/app.js
      - run: node --check gateway/web/theme.js
      - run: node --check gateway/web/i18n.js
      - run: node --check gateway/web/management.js
      - run: node --check gateway/web/terminal-stream.js
      - run: node scripts/check_panel_frontend.mjs
      - run: node scripts/check_terminal_emulator.mjs
      - run: python scripts/check_docs.py
      - run: python scripts/configure.py --env-file .env.example --check
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.proxy.yaml config --quiet
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} -f gateway/Dockerfile -t xray-gateway:test .
      - run: python3 scripts/check_vless_transports.py --image xray-gateway:test
      - run: python3 scripts/smoke_container.py --image xray-gateway:test
