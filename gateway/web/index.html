<dialog id="profileDialog"><form id="profileForm"><div class="section-heading"><span class="eyebrow">VLESS</span><button id="closeDialog" class="text-button" type="button" aria-label="Закрыть" data-i18n-aria="Закрыть"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><h2 id="dialogTitle" data-i18n="Новый профиль">Новый профиль</h2><label id="profileNameField"><span data-i18n="Название">Название</span><input name="name" maxlength="80" required></label><div class="form-pair"><label id="profilePriorityField"><span data-i18n="Приоритет">Приоритет</span><input name="priority" type="number" min="1" max="1000" value="10" required></label><label class="checkbox"><input name="enabled" type="checkbox" checked> <span data-i18n="Участвует в переключении">Участвует в переключении</span></label></div><label><span data-i18n="VLESS URI или ссылка подписки">VLESS URI или ссылка подписки</span><textarea id="profileSource" name="uri" rows="4" spellcheck="false"></textarea></label><p id="profileError" class="error" role="alert"></p><button class="primary" type="submit" data-i18n="Сохранить и применить">Сохранить и применить</button></form></dialog>
<dialog id="subscriptionDialog" class="wide-dialog" aria-labelledby="subscriptionTitle"><form id="subscriptionForm"><div class="section-heading"><h2 id="subscriptionTitle" data-i18n="Профили подписки">Профили подписки</h2><button id="closeSubscription" class="text-button" type="button" aria-label="Закрыть" data-i18n-aria="Закрыть"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label><span data-i18n="Название подписки">Название подписки</span><input id="subscriptionGroupName" maxlength="80" required></label><div id="subscriptionOptions" class="subscription-options"></div><p id="subscriptionError" class="error" role="alert"></p><button id="applySubscription" class="primary" type="submit" data-i18n="Сохранить и применить">Сохранить и применить</button></form></dialog>
<dialog id="ipListDialog"><form id="ipListForm"><div class="section-heading"><h2 id="ipListTitle" data-i18n="Новый список">Новый список</h2><button id="closeIpList" class="text-button" type="button" aria-label="Закрыть" data-i18n-aria="Закрыть"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label><span data-i18n="Название">Название</span><input name="name" maxlength="80" required></label><div class="section-heading ip-list-toolbar"><label for="ipAddresses" data-i18n="IPv4 / IPv6 / CIDR / Домен">IPv4 / IPv6 / CIDR / Домен</label><div class="list-tools"><button id="importIps" class="secondary" type="button" data-i18n="Импорт .txt">Импорт .txt</button><button id="copyIps" class="secondary" type="button" data-i18n="Копировать">Копировать</button></div></div><input id="ipFile" type="file" accept=".txt,text/plain" hidden><textarea id="ipAddresses" name="addresses" rows="12" spellcheck="false"></textarea><p id="ipListError" class="error" role="alert"></p><button id="saveIpList" class="primary" type="submit" data-i18n="Сохранить">Сохранить</button></form></dialog>

<dialog id="userDialog"><form id="userForm"><div class="section-heading"><h2 id="userDialogTitle" data-i18n="Новый пользователь">Новый пользователь</h2><button id="closeUser" class="text-button" type="button" aria-label="Закрыть" data-i18n-aria="Закрыть"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <label><span data-i18n="Логин">Логин</span><input name="username" maxlength="64" autocomplete="off" required></label>
 <label><span data-i18n="Роль">Роль</span><select name="role"><option value="operator" data-i18n="Пользователь">Пользователь</option><option value="admin" data-i18n="Администратор">Администратор</option></select></label>
 <label><span id="userPasswordLabel" data-i18n="Пароль">Пароль</span><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required></label>
 <p id="userError" class="error" role="alert"></p><button class="primary" type="submit" data-i18n="Сохранить пользователя">Сохранить пользователя</button>
</form></dialog>
<dialog id="routerScriptDialog" class="wide-dialog"><div class="section-heading"><h2 data-i18n="Скрипт RouterOS">Скрипт RouterOS</h2><button id="closeRouterScript" type="button" class="text-button" aria-label="Закрыть" data-i18n-aria="Закрыть"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="router-grid"><form id="routerForm" class="panel"><h2 data-i18n="Параметры маршрута">Параметры маршрута</h2><label><span data-i18n="Клиент или подсеть">Клиент или подсеть</span><input name="source" value="" required></label><label><span data-i18n="LAN-интерфейс">LAN-интерфейс</span><input name="interface" value="" required></label><label><span data-i18n="Локальные сети">Локальные сети</span><textarea name="local_networks" rows="3" spellcheck="false"></textarea></label><label><span data-i18n="IP-список">IP-список</span><select id="routerList" name="list_id"><option value="" data-i18n="Вручную">Вручную</option></select></label><label id="manualDestinations"><span data-i18n="Назначения — IP / CIDR / домен">Назначения — IP / CIDR / домен</span><textarea name="destinations" rows="5"></textarea></label><button class="primary" type="submit" data-i18n="Сформировать скрипт">Сформировать скрипт</button></form><div class="panel code-panel"><div class="section-heading"><h2 data-i18n="Команды RouterOS">Команды RouterOS</h2><button id="copyRouter" class="secondary" disabled data-i18n="Копировать">Копировать</button></div><textarea id="routerOutput" readonly spellcheck="false"></textarea><span id="copyStatus" class="muted" role="status"></span></div></div></dialog><dialog id="routerJobDialog" class="wide-dialog"><div class="section-heading"><h2 id="routerJobTitle" data-i18n="Операция RouterOS">Операция RouterOS</h2><button id="closeRouterJob" class="text-button" type="button" aria-label="Закрыть" data-i18n-aria="Закрыть"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="routerJobStatus" role="status"></p><pre id="routerJobLog" class="operation-log" tabindex="0"></pre></dialog>
<dialog id="confirmationDialog" class="confirmation-dialog" aria-labelledby="confirmationTitle" aria-describedby="confirmationText"><h2 id="confirmationTitle" data-i18n="Подтверждение">Подтверждение</h2><p id="confirmationText"></p><div class="confirmation-actions"><button id="confirmationCancel" class="secondary" type="button" autofocus data-i18n="Отмена">Отмена</button><button id="confirmationAccept" class="primary" type="button" data-i18n="Подтвердить">Подтвердить</button></div></dialog>

<script type="application/json" id="pageState">{{PAGE_STATE}}</script></body></html>
