<!doctype html>
<html lang="ru" data-design="titan"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="Xray Gateway — Управление">Xray Gateway — Управление</title><link rel="icon" type="image/png" href="/favicon.png"><script src="/locales.js"></script><script src="/i18n.js"></script><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body>
<section id="loginView" class="login-layout">
 <div class="login-brand"><span class="wordmark"><img class="brand-icon" src="/favicon.png" width="40" height="40" alt="">X / G</span><h1>Xray Gateway</h1><a class="version-link login-version" data-version-link href="https://github.com/QueenDekim/XRay-gateway/tags" target="_blank" rel="noopener noreferrer" hidden></a><div class="brand-bottom">Xray Gateway <span>VLESS · TPROXY</span></div></div>
 <div class="login-side"><form id="loginForm" class="login-form"><div class="login-language"><label for="loginLanguage" data-i18n="Язык">Язык</label><select id="loginLanguage" data-language-select><option value="ru">Русский</option><option value="en">English</option></select></div><h2 data-i18n="Вход">Вход</h2><label><span data-i18n="Логин">Логин</span><input name="username" autocomplete="username" required autofocus></label><label><span data-i18n="Пароль">Пароль</span><input name="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error" role="alert"></p><button class="primary" type="submit" data-i18n="Войти">Войти</button></form></div>
</section>
<dialog id="loginFactorDialog" class="confirmation-dialog" aria-labelledby="loginFactorTitle"><form id="loginFactorForm" class="factor-login-form"><h2 id="loginFactorTitle" data-i18n="Подтверждение входа">Подтверждение входа</h2><label><span data-i18n="Код 2FA или резервный код">Код 2FA или резервный код</span><input id="loginCode" name="code" autocomplete="one-time-code" maxlength="64" required></label><p id="loginFactorError" class="error" role="alert"></p><div class="confirmation-actions"><button id="loginBack" type="button" class="secondary" data-i18n="Отмена">Отмена</button><button type="submit" class="primary" data-i18n="Войти">Войти</button></div></form></dialog>
</body></html>
